services:
  database:
    image: postgres:16
    container_name: music_genre_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - music_network

  backend:
    build: ./backend
    container_name: music_genre_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - music_network

  frontend:
    build: ./frontend
    container_name: music_genre_frontend
    restart: unless-stopped
    environment:
      API_URL: "http://backend:8000"
    depends_on:
      - backend
    ports:
      - "8501:8501"
    networks:
      - music_network

volumes:
  postgres_data:

networks:
  music_network:
    driver: bridge